<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09121e" />
      <stop offset="50%" stop-color="#126b82" />
      <stop offset="100%" stop-color="#d9577e" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  
  <!-- Clipboard / Task Card Shape -->
  <rect x="116" y="128" width="280" height="300" rx="36" fill="rgba(255, 255, 255, 0.95)" filter="url(#shadow)" />
  
  <!-- Header Clip -->
  <rect x="196" y="96" width="120" height="48" rx="16" fill="#126b82" />
  <circle cx="256" cy="120" r="10" fill="#ffffff" />
  
  <!-- Checkmark -->
  <path d="M180 270 L230 320 L330 200" fill="none" stroke="#126b82" stroke-width="36" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Task lines -->
  <rect x="176" y="360" width="160" height="16" rx="8" fill="#a0aec0" />
</svg>
